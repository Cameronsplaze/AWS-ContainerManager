
## TODO: Look into moving this into a gist, and support downloading them in the pipeline?
#     This would allow forks to have unique configs, and not worry about conflicts back to main.
#     Also it would let forks have custom containers that I don't have as an example, AND let them be versioned.
#     I can have extra servers (like the life server) be gists, so having 5 different Minecraft servers here isn't confusing to users.
#     Looks like it'd just be allowing CONFIG_PATH to be a URL. If it is, mask it and download. The
#     container-id being the environment works well for this too, since you won't have the context of the file name anyways.
#              OR put the curl command in the makefile?? So it works on local deployments too.

Ec2:
  InstanceType: m5.large # 2vCPUs, 8GB RAM
  SshCidrAllowed:
    - !ENV ${SSH_IP_CIDR}

Container:
  # Docs here: https://docker-minecraft-server.readthedocs.io/en/latest/
  Image: itzg/minecraft-server
  Ports:
    - TCP: 25565
  Environment:
    EULA: True
    TYPE: FABRIC
    ## Let the memory limit adjust based on how big the ec2 instance is:
    # https://docker-minecraft-server.readthedocs.io/en/latest/configuration/jvm-options/#memory-limit
    MEMORY: "80%"
    ## Inject this to server.properties, so it's dynamic and tells users when server updates:
    # (since we use the latest version that the plugins allow, it'll be random when we update).
    MOTD: |
      §3Sharing Life, so Don't Die ;)
      §r(on §4%VERSION%§r)
    DIFFICULTY: hard

    ## From https://docker-minecraft-server.readthedocs.io/en/latest/configuration/misc-options/#openj9-specific-options
    TUNE_VIRTUALIZED: True
    ENABLE_RCON: False
    ENABLE_ROLLING_LOGS: True

    ## From https://docker-minecraft-server.readthedocs.io/en/latest/configuration/jvm-options/#enable-aikars-flags
    USE_AIKAR_FLAGS: True

    ## https://docker-minecraft-server.readthedocs.io/en/latest/mods-and-plugins/modrinth/#extra-options
    MODRINTH_DOWNLOAD_DEPENDENCIES: required

    # LifeShare:
    #      https://modrinth.com/mod/shared-life
    MODRINTH_PROJECTS: |
      fabric-api
      shared-life

    ## Use maximum version of MC that mods allow:
    VERSION_FROM_MODRINTH_PROJECTS: True


Volume:
  EnableBackups: True
  KeepOnDelete: True
  KeepBackupDays: 720
  Paths:
    - Path: /data
      ReadOnly: False

## Config options for how to monitor for players:
Watchdog:
  Threshold: 1400
  InstanceLeftUp:
    # Just notify:
    DurationHours: 8
    ShouldStop: False

