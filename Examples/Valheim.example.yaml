
Ec2:
  InstanceType: m5.large
  SshCidrAllowed:
    - !ENV ${SSH_IP_CIDR}

Container:
  # Docs here: https://github.com/community-valheim-tools/valheim-server-docker
  Image: ghcr.io/community-valheim-tools/valheim-server
  Ports:
    - UDP: 2456
    - UDP: 2457
    - UDP: 2458 # For CrossPlay! (Mods not recommended with XBox, they can't connect)
  Environment:
    SERVER_NAME: !ENV ${VALHEIM_SERVER_NAME}
    WORLD_NAME: "Valhalla"
    SERVER_PASS: !ENV ${VALHEIM_PASSWORD}
    CROSSPLAY: True # For Microsoft store, NOT XBox. You can't do mods with XBox anyways.
    # World Modifiers list: https://www.reddit.com/r/valheim/comments/16us3ql/how_to_world_modifiers_in_game_works_on_dedicated/
    SERVER_ARGS: "-modifier resources most -modifier portals casual"
    # VALHEIM_PLUS: True # Valheim Plus is becoming more and more unmaintained. Use BepInEx instead.
    # BEPINEX: True
    SERVER_PUBLIC: False
    ## Since we're in the cloud, and server is only up when someone is connected,
    # we can't do stuff "when idle". Instead download update, and server will pick
    # it up on next launch:
    UPDATE_IF_IDLE: False
    RESTART_IF_IDLE: False
    UPDATE_CRON: "" # Otherwise it'll flag the watchdog every 15 minutes.
    RESTART_CRON: ""
    # Backups happen outside of the container already.
    BACKUPS: False
    # Set File Permissions (Helps when accessing files through ec2):
    PUID: 1000
    PGID: 1000

Volume:
  KeepBackupDays: 365
  Paths:
    # Holds server config info
    - Path: /config
    # Holds server download file
    - Path: /opt/valheim

## Config options for how to monitor for players:
Watchdog:
  # The 40-60 range also works here. Valheim just jumps to ~2k when someone is connected.
  Threshold: 800
  InstanceLeftUp:
    DurationHours: 8
    ShouldStop: True
